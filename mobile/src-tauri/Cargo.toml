[package]
name = "mpac-mobile"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "mpac_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-deep-link = "=2.6.3"
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
mpac-mobile-link = { path = "../../crates/mpac-mobile-link" }
mpac-voice = { path = "../../crates/mpac-voice" }
keyring-core = "=1.0.1"

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", features = ["protected", "keychain"] }

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "=1.0.0"
ndk-context = "0.1"

