<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>MPAC · Connect a device</title>
<style>
:root{color-scheme:dark;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e7eee9;background:#121a18}
*{box-sizing:border-box}body{margin:0;padding:22px 30px 28px;text-align:center}header{display:flex;align-items:center;justify-content:space-between;color:#a5b9ac;font-size:13px}select{font:inherit;color:inherit;background:#1e2b25;border:1px solid #43534a;border-radius:7px;padding:5px 26px 5px 8px}.icon{width:62px;height:62px;border:1px solid #486345;border-radius:17px;background:#233426;margin:22px auto 18px;display:grid;place-items:center;color:#c5e7ab;font-size:32px;font-weight:600}h1{font-size:23px;line-height:1.25;margin:0 0 12px}#name{font-size:17px;font-weight:600;overflow-wrap:anywhere;margin:0 0 17px}#instruction{color:#b2c0b8;line-height:1.5;margin:0 auto;max-width:350px}.code{font-size:44px;font-variant-numeric:tabular-nums;letter-spacing:8px;padding:17px 10px 17px 18px;border:1px solid #486345;border-radius:13px;background:#1f3025;margin:20px 0 12px;white-space:nowrap;user-select:all}#status{color:#9cab9f;font-size:13px;min-height:36px;line-height:1.4;margin:0 0 18px}footer{display:flex;gap:10px}button{font:inherit;font-weight:600;min-height:44px;border-radius:9px;border:1px solid #4a5b50;padding:10px 12px;color:#e7eee9;background:#243029;cursor:pointer}#reject{flex:1}#approve{flex:1.7;background:#c0e7a3;color:#1b2a18;border-color:#c0e7a3}button:disabled{opacity:.45;cursor:default}button:focus-visible,select:focus-visible{outline:3px solid #9dc8ec;outline-offset:3px}body[data-error=true] #status{color:#eeb4a8}
</style>
<body>
<header><span>MPAC · <span data-text="request">Device connection</span></span><select id="language" aria-label="Language"><option value="en">English</option><option value="ru">Русский</option><option value="es">Español</option></select></header>
<div class="icon" aria-hidden="true">m·</div>
<h1 data-text="title">Allow this device to connect?</h1>
<p id="name">…</p>
<p id="instruction" data-text="instruction">Compare these numbers with your phone or tablet. Nothing to type.</p>
<div id="code" class="code" aria-label="Verification code">··· ···</div>
<p id="status" role="status" aria-live="polite"></p>
<footer><button id="reject" disabled data-text="reject">Reject</button><button id="approve" disabled data-text="approve">Codes match — Connect</button></footer>
<script>
'use strict';
const messages={
 en:{request:'Device connection',title:'Allow this device to connect?',instruction:'Compare these numbers with your phone or tablet. Nothing to type.',reject:'Reject',approve:'Codes match — Connect',loading:'Checking the connection request…',remaining:'Only connect a device you recognize. Expires in {s}s.',unavailable:'Cannot check this request. Waiting for the local connection…',expired:'This request is no longer active. Open a new invitation on your device.',sending:'Saving your choice…',approved:'Connected. You can return to your device.',rejected:'Connection rejected.',uncertain:'Could not confirm your choice. Check the device list before trying again.'},
 ru:{request:'Подключение устройства',title:'Разрешить подключение?',instruction:'Сравните эти цифры с телефоном или планшетом. Ничего вводить не нужно.',reject:'Отклонить',approve:'Код совпадает — Подключить',loading:'Проверяем запрос подключения…',remaining:'Подключайте только знакомое устройство. Осталось {s} с.',unavailable:'Не удалось проверить запрос. Ожидаем локальное подключение…',expired:'Запрос больше не активен. Откройте новое приглашение на устройстве.',sending:'Сохраняем ваш выбор…',approved:'Подключено. Можно вернуться к устройству.',rejected:'Подключение отклонено.',uncertain:'Не удалось подтвердить результат. Проверьте список устройств перед повторной попыткой.'},
 es:{request:'Conexión de dispositivo',title:'¿Permitir la conexión?',instruction:'Compara estos números con tu teléfono o tablet. No tienes que escribir nada.',reject:'Rechazar',approve:'Coinciden — Conectar',loading:'Comprobando la solicitud…',remaining:'Conecta solo un dispositivo que reconozcas. Caduca en {s} s.',unavailable:'No se puede comprobar la solicitud. Esperando la conexión local…',expired:'La solicitud ya no está activa. Abre una nueva invitación en tu dispositivo.',sending:'Guardando tu elección…',approved:'Conectado. Puedes volver a tu dispositivo.',rejected:'Conexión rechazada.',uncertain:'No se pudo confirmar el resultado. Revisa los dispositivos antes de volver a intentarlo.'}
};
const $=s=>document.querySelector(s),fields=new URLSearchParams(location.hash.slice(1)),token=fields.get('token')||'',id=fields.get('id')||'';
// Keep credentials out of history and never place them in the DOM or errors.
history.replaceState(null,'',location.pathname);
let language='en';try{if(messages[localStorage.getItem('pairing-language')])language=localStorage.getItem('pairing-language')}catch{}
let request=null,busy=false,polling=false,terminal=false,healthy=false,lastCheck=0,statusKey='loading';
function text(key){return messages[language][key]}
function render(){document.documentElement.lang=language;$('#language').value=language;document.querySelectorAll('[data-text]').forEach(e=>e.textContent=text(e.dataset.text));$('#code').setAttribute('aria-label',language==='ru'?'Код подтверждения':language==='es'?'Código de verificación':'Verification code');$('#status').textContent=text(statusKey).replace('{s}',String(Math.max(0,Math.ceil((request?.expires_at||0)-Date.now()/1000))));const live=healthy&&request&&request.expires_at>Date.now()/1000&&Date.now()-lastCheck<4000&&!busy&&!terminal;$('#approve').disabled=!live;$('#reject').disabled=!live;document.body.dataset.error=String(['unavailable','uncertain','expired'].includes(statusKey))}
$('#language').onchange=()=>{language=$('#language').value;try{localStorage.setItem('pairing-language',language)}catch{}render()};
async function call(action,body){const r=await fetch('/admin/'+action,{method:'POST',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(body),cache:'no-store',signal:AbortSignal.timeout(3500)});if(!r.ok)throw new Error('request failed');return r.json()}
async function refresh(){if(polling||busy||terminal)return;polling=true;try{const d=await call('state',{}),p=d.pending.find(p=>p.id===id);lastCheck=Date.now();if(!p){terminal=true;healthy=false;statusKey=d.devices.some(d=>d.id===id)?'approved':'expired'}else if(!/^\d{6}$/.test(p.code)||!Number.isFinite(p.expires_at)){throw new Error('invalid request')}else if(request&&request.code!==p.code){terminal=true;healthy=false;statusKey='expired'}else{request=p;healthy=true;$('#name').textContent=p.name;$('#code').textContent=p.code.slice(0,3)+' '+p.code.slice(3);statusKey='remaining'}}catch{healthy=false;statusKey='unavailable'}finally{polling=false;render()}}
async function decide(action){if(busy||terminal||!healthy||!request||Date.now()-lastCheck>=4000||request.expires_at<=Date.now()/1000)return;busy=true;statusKey='sending';render();try{await call(action,{id,code:request.code});terminal=true;statusKey=action==='approve'?'approved':'rejected'}catch{terminal=true;statusKey='uncertain'}finally{busy=false;healthy=false;render()}}
$('#approve').onclick=()=>decide('approve');$('#reject').onclick=()=>decide('reject');
// No Enter shortcut or default approval: connecting always requires an explicit click.
$('#reject').focus();render();refresh();setInterval(refresh,1200);setInterval(render,500);
</script>
</body></html>
