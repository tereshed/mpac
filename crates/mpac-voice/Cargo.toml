[package]
name = "mpac-voice"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "blocking", "multipart"] }
keyring-core = "=1.0.1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", features = ["protected"] }

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "=1.0.0"

[build-dependencies]
cc = "1"
