[workspace]
members = ["crates/mpac-probe", "crates/mpac-runtime", "crates/mpac-workspace", "crates/mpac-daemon", "crates/mpac-mobile-link", "crates/mpac-voice", "mobile/src-tauri", "desktop/src-tauri"]
default-members = ["crates/mpac-probe", "crates/mpac-runtime", "crates/mpac-workspace", "crates/mpac-daemon"]
exclude = ["vendor/tao"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time", "net", "signal"] }

[patch.crates-io]
tao = { path = "vendor/tao" }
